# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

tasks:
  default:
    deps: [check]

  check:
    - task: test
    - task: type
    - task: lint
    - task: fmtchk

  fix: "{{.RUN}} ruff check --fix {{.CLI_ARGS}}"
  fmt: "{{.RUN}} ruff format {{.CLI_ARGS}}"
  fmtchk: "{{.RUN}} ruff format --check {{.CLI_ARGS}}"
  lint: "{{.RUN}} ruff check {{.CLI_ARGS}}"
  test: "{{.RUN}} python -m unittest test_generate.py {{.CLI_ARGS}}"
  type: "{{.RUN}} pyrefly check {{.PYREFLY}} {{.CLI_ARGS}}"

  gen: "{{.RUN}} generate.py \"{{.MD}}\" -o \"{{.JSON}}\""

vars:
  JSON: '../api/src/help_data.json'
  MD: ''
  PYREFLY: --summarize-errors
  RUN: uv run
